<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
  <rect width="640" height="300" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f6b"/>
    </marker>
  </defs>
  <!-- step boxes -->
  <g>
    <rect x="18" y="40" width="176" height="200" rx="14" fill="#e4f0ee"/>
    <text x="106" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6f6b">DAY 1–2</text>
    <!-- RNA wave with probes -->
    <path d="M42,130 q14,-22 28,0 t28,0 t28,0 t28,0 t14,0" fill="none" stroke="#c0552f" stroke-width="5" stroke-linecap="round"/>
    <circle cx="70" cy="118" r="7" fill="#2e9d57"/>
    <circle cx="126" cy="142" r="7" fill="#c0392b"/>
    <circle cx="154" cy="118" r="7" fill="#2e9d57"/>
    <text x="106" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#17181c">Fold &amp; probe</text>
    <text x="106" y="214" text-anchor="middle" font-size="15" fill="#4f525c">2A3 / DMS</text>
  </g>
  <line x1="198" y1="140" x2="226" y2="140" stroke="#1f6f6b" stroke-width="3" marker-end="url(#ar)"/>
  <g>
    <rect x="232" y="40" width="176" height="200" rx="14" fill="#e4f0ee"/>
    <text x="320" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6f6b">DAY 3</text>
    <!-- nanopore: membrane with pore and strand -->
    <rect x="262" y="124" width="46" height="14" rx="3" fill="#1f6f6b"/>
    <rect x="332" y="124" width="46" height="14" rx="3" fill="#1f6f6b"/>
    <path d="M320,96 C312,106 328,114 320,124 L320,138 C312,150 328,158 320,168" fill="none" stroke="#3a5f8f" stroke-width="5" stroke-linecap="round"/>
    <text x="320" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#17181c">Nanopore</text>
    <text x="320" y="214" text-anchor="middle" font-size="15" fill="#4f525c">service, no primers</text>
  </g>
  <line x1="412" y1="140" x2="440" y2="140" stroke="#1f6f6b" stroke-width="3" marker-end="url(#ar)"/>
  <g>
    <rect x="446" y="40" width="176" height="200" rx="14" fill="#e4f0ee"/>
    <text x="534" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6f6b">DAY 5</text>
    <!-- reactivity bars -->
    <g fill="#1f6f6b">
      <rect x="474" y="132" width="9" height="28"/>
      <rect x="487" y="108" width="9" height="52"/>
      <rect x="500" y="146" width="9" height="14"/>
      <rect x="513" y="96" width="9" height="64"/>
      <rect x="526" y="138" width="9" height="22"/>
      <rect x="539" y="120" width="9" height="40"/>
      <rect x="552" y="150" width="9" height="10"/>
      <rect x="565" y="102" width="9" height="58"/>
      <rect x="578" y="140" width="9" height="20"/>
    </g>
    <line x1="468" y1="161" x2="596" y2="161" stroke="#4f525c" stroke-width="2"/>
    <text x="534" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#17181c">Reactivity</text>
    <text x="534" y="214" text-anchor="middle" font-size="15" fill="#4f525c">per nucleotide</text>
  </g>
  <text x="320" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#4f525c">DNA template to RNA structure data in under a week</text>
</svg>
